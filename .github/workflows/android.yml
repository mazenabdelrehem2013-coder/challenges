# Builds the Android app as an installable APK and attaches it to the "android-latest"
# GitHub release, so anyone can download it from the repo's Releases page and install it.
# No Expo or Google Play account needed; the APK is signed with a local build key.
name: Android APK

on:
  push:
    branches: [main, android-apk]
    paths: ['mobile/**', 'shared/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk challenges.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest challenges.apk --target "$GITHUB_SHA" \
            --title "Android app (latest)" \
            --notes "Download challenges.apk on your Android phone and open it to install. Built from $GITHUB_SHA."
