# Tests every push. On main it also publishes the app, the dashboard and the database
# rules to Firebase, once these are set in GitHub (Settings > Secrets and variables > Actions):
#   variable FIREBASE_PROJECT_ID     your Firebase project id
#   secret   FIREBASE_SERVICE_ACCOUNT the JSON key of a service account that can deploy
name: Test and deploy

on:
  push:
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm ci
        working-directory: dashboard
      - run: npm test
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npm run build
      - name: Deploy to Firebase
        if: github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore --project "$PROJECT" --non-interactive
