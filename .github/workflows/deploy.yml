# Tests every push. On main it also publishes the app, the dashboard and the database
# rules to the Firebase project in .firebaserc, once the repo has the secret
# FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions): the JSON key from
# Firebase console > Project settings > Service accounts > Generate new private key.
name: Test and deploy

on:
  push:
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm ci
        working-directory: dashboard
      - run: npm test
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npm run build
      - name: Deploy to Firebase
        if: github.ref == 'refs/heads/main'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret yet, skipping deploy"; exit 0; fi
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only hosting,firestore --non-interactive
