name: Emulator tour
# Runs the latest Android app on an emulator and publishes screenshots and a short video.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-latest --pattern challenges.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator-tour.sh
      - name: Publish the screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete emulator-tour --yes --cleanup-tag || true
          gh release create emulator-tour tour/* --target "$GITHUB_SHA" --title "Emulator tour" --notes "Screenshots of the Android app running on an emulator."
