# One-click setup for Render (https://render.com): the "Deploy to Render" button in the README uses this.
# Free plan: there is no permanent disk, so the database is copied to Supabase Storage
# (also free) after every change and brought back when the server starts.
services:
  - type: web
    name: challenges
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SEED_DEMO
        value: "false"
